services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production
    environment:
      PORT: ${PORT:-3000}
      # PAWTH_DOCKER_LOCAL: 'true' # ローカル環境用
    depends_on:
      - db
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    volumes:
      - ./log:/app/log
      - ./storage:/app/storage
    restart: always

  db:
    image: postgres:18
    env_file:
      - .env.production
    volumes:
      - prod_db_data:/var/lib/postgresql
    restart: always

volumes:
  prod_db_data:
