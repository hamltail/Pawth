services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    tty: true
    stdin_open: true
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/pawth_development
    volumes:
      - .:/app
    ports:
      - '3000:3000'
    depends_on:
      - db

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pawth_development
    ports:
      - '5432:5432'
    volumes:
      - dev_db_data:/var/lib/postgresql

volumes:
  dev_db_data:
