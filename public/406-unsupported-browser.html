<!doctype html>

<html lang="ja">
  <head>
    <title>このブラウザには対応していません | Pawth</title>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      * {
        margin: 0;
      }

      :root {
        color-scheme: light;

        --bg: #ffffff;
        --surface: #ffffff;
        --surface-soft: #f8f5ff;
        --text: #191b24;
        --muted: #5a5f7d;
        --primary: #6d28d9;
        --primary-hover: #5b21b6;
        --accent: #f472b6;
        --border: #e9e5f7;
        --brand: #30323a;

        --card-shadow: 0 24px 80px rgba(109, 40, 217, 0.08);
        --title-shadow: 0 4px 10px rgb(0 0 0 / 18%);
        --brand-shadow: 0 4px 10px rgb(0 0 0 / 18%);
        --brand-paw-shadow: drop-shadow(0 4px 5px rgb(0 0 0 / 18%));
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #111016;
          --surface: #1a1722;
          --surface-soft: #211b2e;
          --text: #f4f1f8;
          --muted: #aaa3b8;
          --primary: #a78bfa;
          --primary-hover: #8b5cf6;
          --accent: #f9a8d4;
          --border: #342d42;
          --brand: #f4f1f8;

          --card-shadow:
            0 24px 80px rgba(0, 0, 0, 0.28), 0 0 40px rgba(168, 85, 247, 0.08);

          --title-shadow:
            0 0 8px rgba(249, 168, 212, 0.55),
            0 0 18px rgba(249, 168, 212, 0.4),
            0 0 32px rgba(167, 139, 250, 0.25);

          --brand-shadow:
            0 0 8px rgba(249, 168, 212, 0.65),
            0 0 18px rgba(249, 168, 212, 0.48),
            0 0 32px rgba(167, 139, 250, 0.32);

          --brand-paw-shadow: drop-shadow(0 0 6px rgba(249, 168, 212, 0.7))
            drop-shadow(0 0 14px rgba(249, 168, 212, 0.5))
            drop-shadow(0 0 26px rgba(167, 139, 250, 0.34));
        }
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;

        background: radial-gradient(
          circle at 50% 45%,
          var(--surface-soft) 0,
          var(--bg) 55%
        );

        color: var(--text);

        font-family:
          Roboto,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;

        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      main {
        width: min(100%, 900px);
      }

      .error-card {
        position: relative;
        overflow: hidden;

        padding: clamp(72px, 9vw, 96px) clamp(24px, 7vw, 64px)
          clamp(40px, 8vw, 72px);

        text-align: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 32px;
        box-shadow: var(--card-shadow);
      }

      .brand {
        position: absolute;
        top: 28px;
        left: 32px;

        display: inline-flex;
        align-items: center;
        gap: 4px;

        color: var(--brand);
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        text-shadow: var(--brand-shadow);
      }

      .brand-paw-wrapper {
        display: inline-block;
        width: 1.2rem;
        height: 1.2rem;
        flex: none;
        filter: var(--brand-paw-shadow);
      }

      .brand-paw,
      .paw-mark {
        display: block;
        width: 100%;
        height: 100%;

        mask-image: url('/pawth.svg');
        mask-position: center;
        mask-repeat: no-repeat;
        mask-size: contain;

        -webkit-mask-image: url('/pawth.svg');
        -webkit-mask-position: center;
        -webkit-mask-repeat: no-repeat;
        -webkit-mask-size: contain;
      }

      .brand-paw {
        background: currentColor;
      }

      .error-code {
        position: relative;
        z-index: 1;
        font-size: clamp(5rem, 18vw, 9rem);
        font-weight: 900;
        line-height: 0.9;
        letter-spacing: -0.07em;
        color: var(--text);
        text-shadow: var(--title-shadow);
      }

      .paw {
        display: inline-block;
        width: 64px;
        height: 64px;
        margin-top: 28px;

        filter: drop-shadow(0 0 6px rgba(239, 68, 68, 0.75))
          drop-shadow(0 0 14px rgba(239, 68, 68, 0.5))
          drop-shadow(0 0 26px rgba(244, 63, 94, 0.3));

        transform: rotate(-6deg);
      }

      .paw-mark {
        background: linear-gradient(
          180deg,
          #ff9aaa 0%,
          #f43f5e 45%,
          #dc2626 100%
        );
      }

      h1 {
        margin-top: 28px;
        font-size: clamp(1.4rem, 3.2vw, 2rem);
        font-weight: 800;
        line-height: 1.4;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }

      .description {
        max-width: 520px;
        margin: 16px auto 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.8;
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;

        min-height: 48px;
        margin-top: 32px;
        padding: 12px 22px;

        color: #ffffff;
        background: #6d28d9;
        border: 1px solid transparent;
        border-radius: 9999px;

        box-shadow:
          0 8px 20px rgba(109, 40, 217, 0.18),
          0 16px 40px rgba(109, 40, 217, 0.1);

        font-size: 0.95rem;
        font-weight: 700;
        text-decoration: none;

        transition:
          transform 180ms ease,
          background-color 180ms ease,
          box-shadow 180ms ease;
      }

      .back-link:hover {
        background: var(--primary-hover);
        transform: translateY(-2px);
      }

      .back-link:active {
        transform: translateY(0);
      }

      .back-link:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }

      .back-link svg {
        width: 18px;
        height: 18px;
      }

      @media (prefers-color-scheme: dark) {
        .back-link {
          background: #7c3aed;
          box-shadow:
            0 0 10px rgba(196, 181, 253, 0.28),
            0 0 24px rgba(168, 85, 247, 0.2);
        }

        .back-link:hover {
          background: #8b5cf6;
          box-shadow:
            0 0 12px rgba(196, 181, 253, 0.4),
            0 0 30px rgba(168, 85, 247, 0.3);
        }
      }

      @media (max-width: 700px) {
        h1 {
          white-space: normal;
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 16px;
        }

        .error-card {
          padding-top: 76px;
          border-radius: 24px;
        }

        .brand {
          top: 24px;
          left: 24px;
        }

        .paw {
          width: 56px;
          height: 56px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .back-link {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <section class="error-card" aria-labelledby="error-title">
        <div class="brand" aria-label="Pawth">
          <span>Pawth</span>
          <span class="brand-paw-wrapper" aria-hidden="true">
            <span class="brand-paw"></span>
          </span>
        </div>

        <p class="error-code" aria-hidden="true">406</p>

        <div class="paw" aria-hidden="true">
          <span class="paw-mark"></span>
        </div>

        <h1 id="error-title">このブラウザでは歩けないみたい。</h1>

        <p class="description">
          お使いのブラウザには対応していません。
          最新のブラウザに更新して、もう一度アクセスしてください。
        </p>

        <a class="back-link" href="/">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m15 18-6-6 6-6"></path>
          </svg>

          Pawthへ戻る
        </a>
      </section>
    </main>
  </body>
</html>
