<!doctype html>

<html lang="ja">
  <head>
    <title>リクエストを処理できません | Pawth</title>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      * {
        margin: 0;
      }

      :root {
        color-scheme: light;

        --bg: #ffffff;
        --surface: #ffffff;
        --surface-soft: #f8f5ff;

        --text: #191b24;
        --muted: #5a5f7d;

        --primary: #6d28d9;
        --primary-hover: #5b21b6;
        --accent: #f472b6;

        --border: #e9e5f7;

        --card-shadow: 0 24px 80px rgba(109, 40, 217, 0.08);
        --title-shadow: 0 4px 10px rgb(0 0 0 / 18%);
        --paw-shadow:
          0 6px 18px rgba(109, 40, 217, 0.16),
          0 14px 38px rgba(109, 40, 217, 0.1);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;

          --bg: #111016;
          --surface: #1a1722;
          --surface-soft: #211b2e;

          --text: #f4f1f8;
          --muted: #aaa3b8;

          --primary: #a78bfa;
          --primary-hover: #8b5cf6;
          --accent: #f9a8d4;

          --border: #342d42;

          --card-shadow:
            0 24px 80px rgba(0, 0, 0, 0.28), 0 0 40px rgba(168, 85, 247, 0.08);

          --title-shadow:
            0 0 8px rgba(249, 168, 212, 0.55),
            0 0 18px rgba(249, 168, 212, 0.4),
            0 0 32px rgba(167, 139, 250, 0.25);

          --paw-shadow:
            0 0 10px rgba(249, 168, 212, 0.5),
            0 0 24px rgba(167, 139, 250, 0.32);
        }
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;

        padding: 24px;

        background: radial-gradient(
          circle at 50% 45%,
          var(--surface-soft) 0,
          var(--bg) 55%
        );

        color: var(--text);

        font-family:
          Roboto,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;

        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      main {
        width: min(100%, 680px);
      }

      .error-card {
        position: relative;
        overflow: hidden;

        padding: clamp(40px, 8vw, 72px) clamp(24px, 7vw, 64px);

        text-align: center;

        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 32px;

        box-shadow: var(--card-shadow);
      }

      .error-code {
        position: relative;
        z-index: 1;

        font-size: clamp(5rem, 18vw, 9rem);
        font-weight: 900;
        line-height: 0.9;
        letter-spacing: -0.07em;

        color: var(--text);

        text-shadow: var(--title-shadow);
      }

      .paw {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        width: 64px;
        height: 64px;

        margin-top: 28px;

        font-size: 36px;
        line-height: 1;

        background: var(--surface-soft);
        border: 1px solid var(--border);
        border-radius: 20px;

        box-shadow: var(--paw-shadow);

        transform: rotate(-6deg);
      }

      h1 {
        margin-top: 28px;

        font-size: clamp(1.4rem, 4vw, 2rem);
        font-weight: 800;
        line-height: 1.4;
        letter-spacing: -0.02em;
      }

      .description {
        max-width: 440px;

        margin: 16px auto 0;

        color: var(--muted);

        font-size: 1rem;
        line-height: 1.8;
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;

        min-height: 48px;

        margin-top: 32px;
        padding: 12px 22px;

        color: #ffffff;
        background: #6d28d9;

        border: 1px solid transparent;
        border-radius: 9999px;

        box-shadow:
          0 8px 20px rgba(109, 40, 217, 0.18),
          0 16px 40px rgba(109, 40, 217, 0.1);

        font-size: 0.95rem;
        font-weight: 700;
        text-decoration: none;

        transition:
          transform 180ms ease,
          background-color 180ms ease,
          box-shadow 180ms ease;
      }

      .back-link:hover {
        background: var(--primary-hover);
        transform: translateY(-2px);
      }

      .back-link:active {
        transform: translateY(0);
      }

      .back-link:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }

      .back-link svg {
        width: 18px;
        height: 18px;
      }

      .brand {
        margin-top: 36px;

        color: var(--primary);

        font-size: 0.85rem;
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      @media (prefers-color-scheme: dark) {
        .back-link {
          background: #7c3aed;

          box-shadow:
            0 0 10px rgba(196, 181, 253, 0.28),
            0 0 24px rgba(168, 85, 247, 0.2);
        }

        .back-link:hover {
          background: #8b5cf6;

          box-shadow:
            0 0 12px rgba(196, 181, 253, 0.4),
            0 0 30px rgba(168, 85, 247, 0.3);
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 16px;
        }

        .error-card {
          border-radius: 24px;
        }

        .paw {
          width: 56px;
          height: 56px;

          font-size: 32px;

          border-radius: 18px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .back-link {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <section class="error-card" aria-labelledby="error-title">
        <p class="error-code" aria-hidden="true">400</p>

        <div class="paw" aria-hidden="true">🐾</div>

        <h1 id="error-title">うまく足あとをたどれなかったみたい。</h1>

        <p class="description">
          リクエストを正しく処理できませんでした。
          Pawthへ戻って、もう一度試してみてください。
        </p>

        <a class="back-link" href="/">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m15 18-6-6 6-6"></path>
          </svg>

          Pawthへ戻る
        </a>

        <p class="brand">Pawth 🐾</p>
      </section>
    </main>
  </body>
</html>
